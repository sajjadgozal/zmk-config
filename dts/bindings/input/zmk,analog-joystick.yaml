description: |
  Two-axis analog joystick (e.g. a salvaged PS5 controller thumbstick)
  reporting relative mouse-movement input events proportional to
  deflection from center, like a trackpoint.

compatible: "zmk,analog-joystick"

include: base.yaml

properties:
  io-channels:
    type: phandle-array
    required: true
    description: |
      ADC channels for the joystick axes, X first then Y.
      Example: io-channels = <&adc 0>, <&adc 1>;

  deadzone:
    type: int
    default: 150
    description: |
      Minimum deflection, in raw ADC counts, from the resting center
      position before any movement is reported. Increase if the cursor
      drifts at rest.

  max-speed:
    type: int
    default: 1200
    description: |
      Mouse-mode cursor speed, in pixels per second, at full deflection.

  curve:
    type: int
    default: 2
    enum: [1, 2, 3]
    description: |
      Mouse-mode response curve: deflection past the deadzone (0..1) is
      raised to this power. 1 = linear, 2 = quadratic (fine control near
      center), 3 = cubic (even finer near center, steeper at the edge).

  poll-interval-ms:
    type: int
    default: 10
    description: |
      How often to sample the joystick and report movement while it's
      being tilted (or an arrow key is held).

  idle-poll-interval-ms:
    type: int
    default: 30
    description: |
      Slower sampling interval used while the stick is at rest, to save
      power. Also bounds the extra latency before movement starts.

  arrow-layer:
    type: int
    default: 1
    description: |
      ZMK keymap layer index. While this layer is active, the joystick
      reports arrow-key presses (held while tilted past the deadzone,
      released when centered) instead of relative mouse movement.
