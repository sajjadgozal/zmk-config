# Both BLE and USB HID are enabled; use the output-toggle combo (see
# keymap comments) to switch between wireless and wired mode.
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# Mouse/pointer HID reports, needed for the analog joystick + click button.
CONFIG_ZMK_POINTING=y

# Sleep and battery reporting for a coin-cell / small LiPo powered board.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_BATTERY_REPORTING=y
