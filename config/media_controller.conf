# Both BLE and USB HID are enabled; use the output-toggle combo (see
# keymap comments) to switch between wireless and wired mode.
# BLE name is "Media Remote" via CONFIG_ZMK_KEYBOARD_NAME in the shield's
# Kconfig.defconfig (there's no separate CONFIG_ZMK_BLE_DEVICE_NAME symbol).
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# Mouse/pointer HID reports, needed for the joystick + click button.
CONFIG_ZMK_POINTING=y

# play/pause and next sit on D10/D16 (P0.09/P0.10), the chip's NFC1/NFC2
# antenna pins by default, which can't be read as GPIO at all until this
# is set.
CONFIG_NFCT_PINS_AS_GPIOS=y

# EC11_TRIGGER_MODE defaults to EC11_TRIGGER_NONE, meaning the encoder
# driver never sets up a GPIO interrupt at all and just silently never
# reports rotation. Select the global-thread trigger so it actually does.
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Sleep and battery reporting for a coin-cell / small LiPo powered board.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_BATTERY_REPORTING=y

# ZMK's own (still-required) KSCAN integration currently trips Zephyr's
# "Deprecated symbol KSCAN is enabled" check post-Zephyr-4.1-upgrade,
# which otherwise hard-aborts the build on main. Skip the deprecation
# check rather than the (unrelated, still-relevant) warnings it'd hide.
CONFIG_WARN_DEPRECATED=n
